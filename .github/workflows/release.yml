name: Release
on:
  push:
    branches: [main]
    paths: [Cargo.toml, CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare version and release notes
        id: release
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Stable release requires a numeric major.minor.patch version')
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          match = re.search(r'^## \[' + re.escape(version) + r'\].*\n(.*?)(?=^## \[|\Z)', changelog, re.M | re.S)
          if not match or not match.group(1).strip():
              raise SystemExit('Missing release notes for ' + version)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(match.group(1).strip() + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\ntag=v{version}\n')
          PY
      - name: Build and verify source package
        run: cargo package --locked --all-features
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            "target/package/gosh-dl-${RELEASE_VERSION}.crate" \
            --target "$GITHUB_SHA" --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest
